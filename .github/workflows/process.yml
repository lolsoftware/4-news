name: Process News

on:
  schedule:
    - cron: '0 4,5,6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Checkout gh-pages to output dir
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: output
          fetch-depth: 1
        continue-on-error: true

      - name: Create output dir if first run
        run: mkdir -p output/api/articles output/images

      - name: Run processing pipeline
        run: node src/pipeline.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUTPUT_DIR: output
          SITE_URL: https://${{ github.repository_owner }}.github.io/4-news

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages

      - name: Ensure GitHub Pages is enabled
        run: |
          gh api repos/${{ github.repository }}/pages 2>/dev/null || \
          gh api repos/${{ github.repository }}/pages -X POST -f 'source[branch]=gh-pages' -f 'source[path]=/'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
